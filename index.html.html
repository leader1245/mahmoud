<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عيد ميلاد سعيد 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1033;--bg2:#2d1b55;--pink:#ff7eb6;--gold:#ffd166;--mint:#6ee7b7;--cream:#fff4e0;--ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 70%) fixed;background-color:var(--bg);color:var(--ink);overflow-x:hidden}
body.locked{overflow:hidden;height:100%}
main{max-width:720px;margin:auto;padding:24px 16px 60px;text-align:center}
h1{font-size:clamp(2rem,8vw,3.4rem);font-weight:900;margin:8px 0;color:var(--gold)}
h2{font-size:1.4rem;margin:0 0 12px;color:var(--pink)}
p{line-height:1.8}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 22px;background:var(--pink);color:#2a0f3d;cursor:pointer;transition:transform .15s}
button:hover{transform:scale(1.05)}button:active{transform:scale(.95)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
section{background:rgba(255,255,255,.07);border-radius:22px;padding:22px 16px;margin-top:26px}

/* door */
#door{position:fixed;inset:0;z-index:50;perspective:1200px;display:flex}
#door.gone{display:none}
.panel{flex:1;background:linear-gradient(90deg,#5a3418,#8a5a2b 50%,#5a3418);border:6px solid #3a200d;position:relative;transition:transform 1.8s cubic-bezier(.6,0,.2,1)}
.panel::before{content:"";position:absolute;inset:8% 12%;border:4px solid #3a200d;border-radius:8px;box-shadow:inset 0 0 20px #0006}
#pl{transform-origin:left center}#pr{transform-origin:right center}
#door.open #pl{transform:rotateY(-110deg)}#door.open #pr{transform:rotateY(110deg)}
#knock{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s;pointer-events:none}
#knock button{pointer-events:auto;background:var(--gold);font-size:1.15rem;animation:pulse 1.4s infinite}
#knock span{font-size:3rem}
#door.open #knock{opacity:0}
@keyframes pulse{50%{transform:scale(1.08)}}

/* cake */
.cakewrap{margin:18px auto 0;width:300px;max-width:100%;position:relative;height:340px}
.candles{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;gap:22px}
.candle{width:12px;height:44px;border-radius:3px;background:repeating-linear-gradient(45deg,#fff 0 6px,var(--pink) 6px 12px);position:relative;margin-top:30px}
.flame{position:absolute;top:-26px;left:50%;width:14px;height:22px;margin-left:-7px;background:radial-gradient(#fff 15%,#ffd166 45%,#ff7a18);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:fl .3s infinite alternate;transform-origin:bottom;box-shadow:0 0 18px #ffb347}
.out .flame{display:none}
@keyframes fl{to{transform:scale(1.15,.9) rotate(4deg)}}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:18px 18px 8px 8px}
.t1{top:76px;width:180px;height:70px;background:linear-gradient(#ffc2de,#ff7eb6);border-top:12px solid #fff}
.t2{top:140px;width:270px;height:140px;background:linear-gradient(#ffe0a8,#ffb454);border-top:14px solid #fff}
.plate{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);width:310px;height:16px;background:#e8e0f5;border-radius:50%;box-shadow:0 10px 0 #b8aad6}
.photo{position:absolute;top:156px;left:50%;transform:translateX(-50%);width:118px;height:118px;border-radius:50%;border:5px solid var(--gold);background:#fff center/cover no-repeat;box-shadow:0 6px 18px #0006;z-index:3}
.berries{position:absolute;top:140px;left:50%;transform:translateX(-50%);width:270px;display:flex;justify-content:space-around;font-size:1.4rem;z-index:2}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}

/* balloons */
#sky{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(#3b82f6,#bde0fe);touch-action:manipulation}
.b{position:absolute;bottom:-70px;width:48px;height:60px;border-radius:50% 50% 50% 50%/55% 55% 45% 45%;cursor:pointer;animation:up 6s linear forwards;border:0;padding:0}
.b::after{content:"";position:absolute;left:50%;top:100%;height:20px;border-left:2px solid #fff8}
@keyframes up{to{transform:translateY(-400px)}}
.score{font-size:1.2rem;font-weight:900;color:var(--gold)}

/* gifts */
.gifts{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.gift{font-size:3.4rem;background:none;padding:6px 10px;border-radius:16px}
.gift.o{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.4) rotate(10deg)}}
#msg,#giftmsg{min-height:3.4em;font-size:1.15rem;font-weight:700;margin-top:12px;color:var(--cream)}
canvas{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){.flame,#knock button{animation:none}.panel{transition-duration:.01s}}
</style>
</head>
<body class="locked">

<div id="door">
  <div class="panel" id="pl"></div><div class="panel" id="pr"></div>
  <div id="knock"><span>🚪</span><button id="openBtn">افتح الباب 🎁</button></div>
</div>

<canvas id="cv"></canvas>

<main>
  <h1 id="title">كل سنة وإنت طيب! 🎉</h1>
  <p>الأوضة دي متجهزة مخصوص عشانك… جرّب كل حاجة جواها 👇</p>

  <div class="row">
    <button id="blow">💨 طفّي الشموع</button>
    <button id="relight">🔥 ولّعها تاني</button>
    <button id="song">🎵 اسمع الأغنية</button>
  </div>

  <section>
    <h2>🎈 فرقع البلالين</h2>
    <p class="score">النتيجة: <span id="sc">0</span></p>
    <div id="sky"></div>
  </section>

  <section>
    <h2>🎁 افتح الهدايا</h2>
    <div class="gifts" id="gifts"></div>
    <div id="giftmsg">اختار هدية!</div>
  </section>

  <section>
    <h2>✨ أمنيات من القلب</h2>
    <button id="wish">هات أمنية</button>
    <div id="msg"></div>
  </section>

  <section>
    <h2>🧠 اعرف عمرك الحقيقي</h2>
    <p>اكتب عمرك واضغط:</p>
    <div class="row"><input id="age" type="number" min="1" max="120" placeholder="عمرك" style="font:inherit;padding:10px 14px;border-radius:999px;border:0;width:120px;text-align:center"><button id="ageBtn">احسب</button></div>
    <div id="ageOut" style="margin-top:12px;font-weight:700;color:var(--cream)"></div>
  </section>

  <section>
    <h2>🎊 مفاجأة أخيرة</h2>
    <button id="boom">كونفيتي! 🎉</button>
  </section>
</main>

<script>
const NAME = "يا صاحبي";
const $ = s => document.querySelector(s);
const cv = $('#cv'), cx = cv.getContext('2d');
function rs(){cv.width = innerWidth; cv.height = innerHeight}
rs(); addEventListener('resize', rs);

/* confetti */
let parts = [], run = false;
function boom(n = 160, x = innerWidth/2, y = innerHeight/3){
  const cols = ['#ff7eb6','#ffd166','#6ee7b7','#7dd3fc','#c4b5fd'];
  for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*14,vy:Math.random()*-13-3,s:5+Math.random()*6,c:cols[i%5],r:Math.random()*6,life:140});
  if(!run){run = true; loop()}
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(p => p.life-- > 0);
  parts.forEach(p => {p.x += p.vx; p.y += p.vy; p.vy += .3; p.r += .2; cx.fillStyle = p.c; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore()});
  if(parts.length) requestAnimationFrame(loop); else {run = false; cx.clearRect(0,0,cv.width,cv.height)}
}

/* music: happy birthday */
let ac;
function song(){
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  const f = {C:261.63,D:293.66,E:329.63,F:349.23,G:392,A:440,B:466.16,H:523.25};
  const m = "C.75 C.25 D1 C1 F1 E2 C.75 C.25 D1 C1 G1 F2 C.75 C.25 H1 A1 F1 E1 D1 B.75 B.25 A1 F1 G1 F2".split(' ');
  let t = ac.currentTime + .05;
  m.forEach(n => {
    const d = parseFloat(n.slice(1)) * .45, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = f[n[0]];
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.25,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d); t += d;
  });
}
$('#song').onclick = () => {song(); boom(60)};

/* door */
$('#openBtn').onclick = () => {
  $('#door').classList.add('open');
  setTimeout(() => {document.body.classList.remove('locked'); boom(200); $('#title').textContent = 'كل سنة وإنت طيب ' + NAME + '! 🎉'}, 1500);
  setTimeout(() => $('#door').classList.add('gone'), 2000);
  try{song()}catch(e){}
};

/* candles */
$('#blow').onclick = () => {$('#cake').classList.add('out'); boom(200); $('#msg').textContent = 'اتمنى أمنية… 🤫'};
$('#relight').onclick = () => $('#cake').classList.remove('out');

/* balloons */
let score = 0, cols = ['#ff4d6d','#ffd166','#06d6a0','#a78bfa','#fb923c'];
const sky = $('#sky');
setInterval(() => {
  if(document.hidden) return;
  const b = document.createElement('button');
  b.className = 'b'; b.setAttribute('aria-label','بالونة');
  b.style.left = Math.random()*(sky.clientWidth-50) + 'px';
  b.style.background = cols[Math.random()*5|0];
  b.onclick = e => {score++; $('#sc').textContent = score; const r = b.getBoundingClientRect(); boom(14,r.left+24,r.top+30); b.remove(); if(score % 10 === 0) boom(150)};
  b.onanimationend = () => b.remove();
  sky.appendChild(b);
}, 900);

/* gifts */
const gl = ['🎁 قسيمة عشاء على حسابي!','🎁 حضن دبّ ضخم 🧸','🎁 لفة بالعربية في أي مكان تختاره','🎁 مليون جنيه… في الخيال بس 😂','🎁 طلب واحد مستجاب من غير نقاش','🎁 فسحة وقهوة عليا ☕'];
const gw = $('#gifts');
['🎁','🎀','📦'].forEach(e => {
  const b = document.createElement('button'); b.className = 'gift'; b.textContent = e; b.setAttribute('aria-label','هدية');
  b.onclick = () => {b.classList.add('o'); b.textContent = '🎉'; $('#giftmsg').textContent = gl[Math.random()*gl.length|0]; boom(80)};
  gw.appendChild(b);
});

/* wishes */
const ws = ['ربنا يديك الصحة والسعادة ويحقق كل أحلامك 🤲','سنة جديدة كلها خير وفلوس وضحك 💸','تفضل دايمًا أحلى صاحب في الدنيا ❤️','عقبال ما نحتفل بيك في كل نجاح جديد 🏆','عمر جديد ورزق جديد وفرحة جديدة ✨','أكتر حد يستاهل التورتة دي… إنت 🎂'];
$('#wish').onclick = () => {$('#msg').textContent = ws[Math.random()*ws.length|0].replace('إنت', 'إنت يا ' + NAME.replace('يا ','')); boom(70)};

/* age */
$('#ageBtn').onclick = () => {
  const a = +$('#age').value;
  if(!a){$('#ageOut').textContent = 'اكتب عمرك الأول 😄'; return}
  $('#ageOut').textContent = `${a} سنة = ${a*12} شهر = ${a*365} يوم من الجمال ✨ وما زلت شباب!`;
  boom(80);
};
$('#boom').onclick = () => boom(300, innerWidth/2, innerHeight/2);
</script>
</body>
</html>
